spring.application.name=config-server
server.port=8888

spring.profiles.active=native
##classpath means files will be in a jar so rebuild is necessary for each update
#spring.cloud.config.server.native.search-locations=classpath:/config-files/{application}

##file means properties will be read from disk and no need for restart.
spring.cloud.config.server.native.search-locations=file:${CONFIG_FILE_LOCATIONS:D:/bootcamp/config-files}/{application}/

management.endpoint.health.show-details=always

