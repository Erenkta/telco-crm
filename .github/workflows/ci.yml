name: CI

on:
  push: # after merging the pr
    branches: [ main ]
  pull_request: #each time the main branch pull requested and each commit into this pull request.
    branches: [ main ]

# The workflow only needs to read the repo.  Least privilage
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker is preinstalled on ubuntu-latest, so Testcontainers works without extra setup.
      - name: Build and test
        run: mvn -B verify

      # Runs on failure too: a red build is exactly when the reports are needed.
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 14
