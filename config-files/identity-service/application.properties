# Served by config-server for every profile of identity-service.
# spring.application.name / spring.profiles.active / spring.config.import are NOT here: the service needs them
# before it contacts the config server, so they live only in the service's own application.properties.

## APP Properties
app.pageable.default-page-size:50
app.pageable.max-page-size:1000
app.pageable.default-sort-by:createdAt
app.pageable.sort-whitelist:createdAt,updatedAt
