# Served by config-server for every profile of customer-service.
# spring.application.name / spring.profiles.active / spring.config.import are NOT here: the service needs them
# before it contacts the config server, so they live only in the service's own application.properties.

# Entities are mapped to DTOs inside service transactions; no lazy loading during JSON rendering.
spring.jpa.open-in-view=false

## APP Properties
app.pageable.default-page-size:20
app.pageable.max-page-size:100
app.pageable.default-sort-by:createdAt
app.pageable.sort-whitelist:createdAt,updatedAt,email
