# Server Configuration
server.port=9001

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/identity
spring.datasource.username=${IDENTITY_SRV_POSTGRES_USER:identity_user}
spring.datasource.password=${IDENTITY_SRV_POSTGRES_PASSWORD:identity_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

eureka.client.service-url.defaultZone= http://${EUREKA_SERVER_HOST:localhost}:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging (ECS Structured Logging)
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.file.name=logs/identity-service.log