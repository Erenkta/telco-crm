server.port=9003

spring.datasource.url=jdbc:postgresql://localhost:5432/orders
spring.datasource.username=${ORDER_SRV_POSTGRES_USER:orders_user}
spring.datasource.password=${ORDER_SRV_POSTGRES_PASSWORD:orders_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.file.name=logs/order-service.log

## APP Properties
app.pageable.default-page-size:10
app.pageable.max-page-size:1000
app.pageable.default-sort-by:createdAt
app.pageable.sort-whitelist:createdAt,updatedAt