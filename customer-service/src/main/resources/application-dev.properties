# Server Configuration
server.port=9002

# Database Configuration (PostgreSQL) - DB and user are created by scripts/init.sql
spring.datasource.url=jdbc:postgresql://localhost:5432/customer
spring.datasource.username=${CUSTOMER_SRV_POSTGRES_USER:customer_user}
spring.datasource.password=${CUSTOMER_SRV_POSTGRES_PASSWORD:customer_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.file.name=logs/customer-service.log
