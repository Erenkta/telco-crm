spring.application.name=customer-service
spring.profiles.active=${CUSTOMER_SRV_ACTIVE_PROF:dev}

# Config server. Name, profile and this import must stay local: the service needs them BEFORE it can ask
# the config server "I am customer-service, profile dev". Locally the config server is off by default
# (USE_CONFIG_SERVER=true to use it), so the same properties are also kept in this module (see ADR-002).
spring.config.import=optional:configserver:http://${CONFIG_SERVER_NAME:localhost}:${CONFIG_SERVER_PORT:8888}
spring.cloud.config.enabled=${USE_CONFIG_SERVER:false}

# Entities are mapped to DTOs inside service transactions; no lazy loading during JSON rendering.
spring.jpa.open-in-view=false

## APP Properties
app.pageable.default-page-size:20
app.pageable.max-page-size:100
app.pageable.default-sort-by:createdAt
app.pageable.sort-whitelist:createdAt,updatedAt,email
